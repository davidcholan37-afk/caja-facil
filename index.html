<body>
  <div id="bg" aria-hidden="true"></div>
  <div id="app">
    <aside class="side" aria-label="Menú">
      <div class="brand" title="Caja Fácil"><span class="logo">S/</span><span class="bt"><b id="bizName">Caja Fácil</b><small id="storeName">Punto de venta</small></span></div>
      <nav id="sideNav"></nav>
      <div class="sidefoot">
        <button class="sidehide" data-a="sidetoggle" title="Ocultar el menú para tener más espacio"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15M15.5 10l-2 2 2 2"/></svg><span>Ocultar</span></button>
        <button class="sidehide fullbtn" data-a="fulltoggle" title="Pantalla completa: sin la barra de Windows (mantén Esc para salir)"><svg class="fsin" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg><svg class="fsout" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/></svg><span class="fsin">Completa</span><span class="fsout">Normal</span></button>
        <button class="themebtn" data-a="theme" title="Cambiar tema"><svg class="tdark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="tlight" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span class="tdark">Oscuro</span><span class="tlight">Claro</span></button>
        <div class="uchip" id="userChip"></div>
        <button class="lockbtn" data-a="switchuser" title="Cambiar de usuario"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Salir</span></button>
      </div>
    </aside>
    <button class="siderail" data-a="sidetoggle" title="Mostrar el menú" aria-label="Mostrar el menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button>
    <main id="view" tabindex="-1"></main>
    <nav class="tabs" id="tabNav" aria-label="Menú principal"></nav>
  </div>

  <div id="lock" hidden>
    <div class="lock-box">
      <span class="logo big">S/</span>
      <h1 id="lockTitle">Caja Fácil</h1>
      <p id="lockSub"></p>
      <div class="lusers" id="lockUsers" hidden></div>
      <div id="lockPinArea">
        <div class="dots" id="lockDots"><i></i><i></i><i></i><i></i></div>
        <div class="keypad" id="lockPad"></div>
      </div>
      <button class="link" id="lockCancel" hidden>Cancelar</button>
    </div>
  </div>

  <div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print" aria-hidden="true"></div>

  <button class="help-launcher" id="helpLauncher" type="button" data-a="ayudaAbrir" aria-haspopup="dialog" aria-controls="helpChat" aria-label="Abrir el chat con Luis">
    <span class="hl-orb" aria-hidden="true"><i class="r"></i><i class="h"></i><b>L</b></span><span class="hl-name">Luis</span>
  </button>
  <section class="help-chat" id="helpChat" role="dialog" aria-label="Chat con Luis, ayuda de Caja Fácil" aria-modal="false" hidden>
    <header class="help-head">
      <span class="hl-orb big" aria-hidden="true"><i class="r"></i><i class="h"></i><b>L</b></span>
      <div class="help-head-title"><strong>Luis</strong><span id="helpStatus" class="help-status"><em class="dot"></em><span>Listo</span></span></div>
      <button class="help-close" type="button" data-a="ayudaCerrar" aria-label="Cerrar chat">×</button>
    </header>
    <div class="help-where" id="helpWhere" aria-live="polite"></div>
    <div class="help-messages" id="helpMessages" role="log" aria-live="polite" aria-relevant="additions text"></div>
    <div class="help-chips" id="helpChips" role="group" aria-label="Preguntas sugeridas"></div>
    <form class="help-form" id="helpForm">
      <label class="help-visually-hidden" for="helpInput">Escribe tu pregunta o una orden</label>
      <span class="help-prompt" aria-hidden="true">›</span>
      <input class="help-input" id="helpInput" type="text" maxlength="1200" autocomplete="off" placeholder="Pregunta o da una orden…" required>
      <button class="help-send" id="helpSend" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
    <p class="help-note">La IA solo recibe lo que escribes aquí, no tus ventas ni clientes. Máx. 50 preguntas al día. No compartas contraseñas ni PIN.</p>
  </section>

  <noscript><p style="padding:24px;font-family:sans-serif;color:#fff">Caja Fácil necesita JavaScript para funcionar.</p></noscript>
